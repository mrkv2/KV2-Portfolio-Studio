name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Bootstrap and migration
        run: php tests/smoke-bootstrap.php
      - name: Package contract
        run: php tests/validate-package.php
      - name: Security contract
        run: php tests/security-contract.php
      - name: SEO contract
        run: php tests/seo-contract.php
      - name: Migration contract
        run: php tests/migration-contract.php
      - name: Shortcode filter contract
        run: php tests/shortcode-filters-contract.php
      - name: Single layout contract
        run: php tests/single-layout-contract.php
      - name: Editor experience contract
        run: php tests/editor-experience-contract.php
      - name: City selector contract
        run: php tests/city-selector-contract.php
      - name: City selector JavaScript
        run: node --check assets/city-selector.js && node tests/city-selector-node-test.js
      - name: Upgrade timing contract
        run: php tests/upgrade-timing-contract.php
      - name: Internal linking contract
        run: php tests/internal-linking-contract.php
